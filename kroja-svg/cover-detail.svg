<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Macro technical drawing of a stitched leather corner">
  <!--
    KROJA schematic — DETAIL (ratio 1:1)
    The cover deliberately overflows the frame: this is a crop, not the whole object.
  -->
  <defs>
    <pattern id="hatch-fine" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--hatch-stroke, #1C1917)" stroke-width="0.9" opacity="0.32"/>
    </pattern>
    <pattern id="hatch-coarse" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="var(--hatch-stroke, #1C1917)" stroke-width="2.6" opacity="0.38"/>
    </pattern>
    <pattern id="hatch-cross" width="14" height="14" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="14" y2="14" stroke="var(--hatch-stroke, #1C1917)" stroke-width="1.3" opacity="0.3"/>
      <line x1="14" y1="0" x2="0" y2="14" stroke="var(--hatch-stroke, #1C1917)" stroke-width="1.3" opacity="0.3"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#DED5C7" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- leather corner, overflowing the frame on two sides -->
  <rect id="cover-body" x="96" y="96" width="400" height="400" rx="14"
        fill="var(--cover-fill, #8B4A2B)" stroke="#1C1917" stroke-width="2"/>
  <rect id="cover-hatch" x="96" y="96" width="400" height="400" rx="14" fill="url(#hatch-fine)"/>

  <!-- burnished edge: thicker line along the two visible sides -->
  <path id="edge" d="M 96 400 L 96 110 Q 96 96 110 96 L 400 96"
        fill="none" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>

  <!-- stitch line, inset -->
  <path d="M 136 400 L 136 150 Q 136 136 150 136 L 400 136"
        fill="none" stroke="var(--stitch-stroke, #C9B79A)" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- individual stitch holes -->
  <g fill="#1C1917" opacity="0.8">
    <circle cx="136" cy="380" r="3.2"/>
    <circle cx="136" cy="332" r="3.2"/>
    <circle cx="136" cy="284" r="3.2"/>
    <circle cx="136" cy="236" r="3.2"/>
    <circle cx="136" cy="188" r="3.2"/>
    <circle cx="168" cy="136" r="3.2"/>
    <circle cx="216" cy="136" r="3.2"/>
    <circle cx="264" cy="136" r="3.2"/>
    <circle cx="312" cy="136" r="3.2"/>
  </g>

  <!-- leader lines -->
  <line x1="40" y1="300" x2="92" y2="300" stroke="#8A7F72" stroke-width="0.9"/>
  <text x="20" y="292" font-size="9.5" fill="#8A7F72" font-family="system-ui, sans-serif">burnished edge</text>

  <line x1="40" y1="236" x2="132" y2="236" stroke="#8A7F72" stroke-width="0.9"/>
  <text x="20" y="228" font-size="9.5" fill="#8A7F72" font-family="system-ui, sans-serif">stitch density</text>

  <rect id="colour-chip" x="20" y="20" width="14" height="14" fill="var(--cover-fill, #8B4A2B)" stroke="#1C1917" stroke-width="0.8"/>
  <text id="colour-name" x="42" y="31" font-size="11" fill="#1C1917" font-family="system-ui, sans-serif">Cognac</text>

  <text x="20" y="372" font-size="9.5" font-weight="600" fill="#A63D2F" font-family="system-ui, sans-serif">NOT IN FRAME: cord, engraving, props</text>
</svg>
