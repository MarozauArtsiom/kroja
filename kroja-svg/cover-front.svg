<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Technical drawing of a leather notebook cover, front view">
  <!--
    KROJA schematic, FRONT view (ratio 4:5).
    Customisable through three CSS custom properties, set them on a parent element:
      cover-fill     : body colour, follows the selected leather colour
      stitch-stroke  : thread colour
      hatch-stroke   : leather hatch colour
    Swap the leather hatch by changing the fill of #cover-hatch between
    url(#hatch-fine), url(#hatch-coarse) and url(#hatch-cross).
  -->
  <defs>
    <pattern id="hatch-fine" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="var(--hatch-stroke, #1C1917)" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <pattern id="hatch-coarse" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="var(--hatch-stroke, #1C1917)" stroke-width="1.4" opacity="0.4"/>
    </pattern>
    <pattern id="hatch-cross" width="7" height="7" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="7" y2="7" stroke="var(--hatch-stroke, #1C1917)" stroke-width="0.7" opacity="0.32"/>
      <line x1="7" y1="0" x2="0" y2="7" stroke="var(--hatch-stroke, #1C1917)" stroke-width="0.7" opacity="0.32"/>
    </pattern>
  </defs>

  <!-- frame crop guide -->
  <rect x="8" y="8" width="384" height="484" fill="none" stroke="#DED5C7" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- cover body: THE fill that changes with colour selection -->
  <rect id="cover-body" x="102" y="110" width="196" height="280" rx="6"
        fill="var(--cover-fill, #8B4A2B)" stroke="#1C1917" stroke-width="1.5"/>

  <!-- leather hatch overlay -->
  <rect id="cover-hatch" x="102" y="110" width="196" height="280" rx="6"
        fill="url(#hatch-fine)" stroke="none"/>

  <!-- fold line near the spine -->
  <line x1="128" y1="110" x2="128" y2="390" stroke="#1C1917" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- saddle stitch, inset 12 -->
  <rect id="stitch" x="114" y="122" width="172" height="256" rx="3"
        fill="none" stroke="var(--stitch-stroke, #C9B79A)" stroke-width="1.4" stroke-dasharray="4 4"/>

  <!-- engraving zone (hidden when no engraving) -->
  <g id="engraving-zone">
    <rect x="198" y="330" width="76" height="28" fill="none" stroke="#8A7F72" stroke-width="1" stroke-dasharray="2 2"/>
    <text id="engraving-text" x="236" y="349" text-anchor="middle" font-size="11" fill="#8A7F72" font-family="Georgia, serif">ENGRAVING</text>
  </g>

  <!-- colour chip -->
  <rect id="colour-chip" x="20" y="20" width="14" height="14" fill="var(--cover-fill, #8B4A2B)" stroke="#1C1917" stroke-width="0.8"/>
  <text id="colour-name" x="42" y="31" font-size="11" fill="#1C1917" font-family="system-ui, sans-serif">Cognac</text>
  <text id="leather-name" x="20" y="50" font-size="10" fill="#8A7F72" font-family="system-ui, sans-serif">Vegetable-tanned</text>

  <!-- callouts -->
  <text x="20" y="416" font-size="9.5" fill="#8A7F72" font-family="system-ui, sans-serif">→ must show: leather grain</text>
  <text x="20" y="429" font-size="9.5" fill="#8A7F72" font-family="system-ui, sans-serif">→ must show: stitch line</text>
  <text x="20" y="442" font-size="9.5" fill="#8A7F72" font-family="system-ui, sans-serif">→ must show: burnished edge</text>

  <!-- warning -->
  <text x="20" y="470" font-size="9.5" font-weight="600" fill="#A63D2F" font-family="system-ui, sans-serif">NOT IN FRAME: cord, engraving, props</text>
</svg>
