<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-label="Illustration: how a hand saddle stitch locks">
  <!-- KROJA landing — SADDLE STITCH. Explains why the seam does not unravel. -->
  <rect x="0" y="120" width="400" height="80" fill="#8B4A2B" stroke="#1C1917" stroke-width="1.4"/>

  <!-- stitch holes -->
  <g fill="#1C1917">
    <circle cx="60" cy="160" r="4"/><circle cx="120" cy="160" r="4"/>
    <circle cx="180" cy="160" r="4"/><circle cx="240" cy="160" r="4"/>
    <circle cx="300" cy="160" r="4"/><circle cx="360" cy="160" r="4"/>
  </g>

  <!-- two threads crossing through every hole -->
  <path d="M 30 132 Q 60 160 120 132 Q 150 118 180 132 Q 210 160 240 132 Q 270 118 300 132 Q 330 160 380 132"
        fill="none" stroke="#C9B79A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 30 188 Q 60 160 120 188 Q 150 202 180 188 Q 210 160 240 188 Q 270 202 300 188 Q 330 160 380 188"
        fill="none" stroke="#8A7F72" stroke-width="2.6" stroke-linecap="round"/>

  <text x="20" y="44" font-size="13" fill="#1C1917" font-family="Georgia, serif">Two threads, one hole</text>
  <text x="20" y="66" font-size="11" fill="#8A7F72" font-family="system-ui, sans-serif">Each stitch locks against the next.</text>
  <text x="20" y="82" font-size="11" fill="#8A7F72" font-family="system-ui, sans-serif">Cut the thread in the middle and the seam holds.</text>

  <line x1="240" y1="230" x2="240" y2="176" stroke="#8A7F72" stroke-width="0.9"/>
  <text x="200" y="250" font-size="10" fill="#8A7F72" font-family="system-ui, sans-serif">crossing point</text>
</svg>
